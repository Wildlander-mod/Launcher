name: Pre-merge

on:
  push:
    branches:
      - 'release-temp/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run lint -- --no-fix

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit

  test-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright dependencies
        run: npx playwright install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .playwright/
          include-hidden-files: 'true'

  test-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright screenshot tests in Docker
        run: npm run test:e2e:screenshot:ci

      - name: Copy test results from container
        if: ${{ !cancelled() }}
        run: |
          CONTAINER_ID=$(docker ps -a --filter ancestor=playwright-screenshot-e2e-tests-ci:latest --format "{{.ID}}")
          docker cp $CONTAINER_ID:/home/app/.playwright .

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: .playwright
          retention-days: 30
          include-hidden-files: 'true'

  # Validate that commits are following the conventional commit format
  commit-validate:
    #  Don't run for dependabot updates
    if: contains(github.head_ref, 'dependabot/') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: install dependencies
        run: npm ci --legacy-peer-deps

      - name: lint commits
        run: npx commitlint --from origin/main

  version-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: bump version dry run
        run: npx standard-version --dry-run